<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#065f46" />
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Melon sphere -->
    <circle cx="256" cy="280" r="180" fill="#f59e0b" />
    <circle cx="256" cy="280" r="180" fill="url(#melonGlow)" />
    <!-- Netting lines (cantaloupe/netted melon texture) -->
    <path d="M120 230 Q256 160 392 230" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.75" stroke-dasharray="8 6" />
    <path d="M100 280 Q256 220 412 280" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.75" stroke-dasharray="8 6" />
    <path d="M120 330 Q256 380 392 330" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.75" stroke-dasharray="8 6" />
    <path d="M190 130 Q140 280 190 420" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.75" stroke-dasharray="8 6" />
    <path d="M256 100 Q210 280 256 460" fill="none" stroke="#fef3c7" stroke-width="7" opacity="0.8" stroke-dasharray="8 6" />
    <path d="M322 130 Q372 280 322 420" fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.75" stroke-dasharray="8 6" />
    <!-- Melon stem / tangkai -->
    <path d="M256 100 C256 60 280 40 310 30" fill="none" stroke="#15803d" stroke-width="18" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M256 80 C290 50 350 70 340 110 C320 120 280 110 256 80 Z" fill="#22c55e" />
    <path d="M256 80 C220 50 160 70 170 110 C190 120 230 110 256 80 Z" fill="#16a34a" />
  </g>
  <defs>
    <radialGradient id="melonGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
</svg>
